- Inference:
    - Strata:
        icon: mdi-brain
        href: http://localhost:2026/
        description: Qwen3.8-Flash-Next · OpenAI API at :2026/v1
        widget:
          type: customapi
          url: http://127.0.0.1:2027/status
          username: admin
          password: "{{HOMEPAGE_VAR_ADMIN_TOKEN}}"
          mappings:
            - field: unit
              label: service
            - field: api
              label: api
    - LiteLLM:
        icon: mdi-router-network
        href: http://localhost:4000/ui
        description: Proxy at :4000/v1 · keys, logs, spend
        widget:
          type: customapi
          url: http://127.0.0.1:4000/health/readiness
          mappings:
            - field: status
              label: proxy
            - field: db
              label: db
- Admin:
    - Strata control:
        icon: mdi-power
        href: http://localhost:2027/
        description: start / stop / restart the model server
    - Cockpit:
        icon: cockpit
        href: https://localhost:9090/
        description: system admin · services, logs, terminal, updates
        siteMonitor: https://127.0.0.1:9090/
