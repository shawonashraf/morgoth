model_list:
  - model_name: qwen3.8-flash-next
    litellm_params:
      model: openai/qwen3.8-flash-next-iq3_s
      api_base: http://127.0.0.1:2026/v1
      api_key: os.environ/STRATA_SERVER_MORGOTH_KEY
    model_info:
      # strata runs with --max-context 262144; input and output share that window
      max_tokens: 262144
      max_input_tokens: 262144
      max_output_tokens: 262144

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  disable_env_credential_login: true
  hide_default_credentials_hint: true # the login page otherwise advertises admin + master key
