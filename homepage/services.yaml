- Inference:
    - Strata:
        icon: mdi-brain
        href: /strata/
        description: Qwen3.8-Flash-Next · chat UI; use the LiteLLM API from outside
        widget:
          type: customapi
          url: http://127.0.0.1:2027/status
          username: admin
          password: "{{HOMEPAGE_VAR_ADMIN_TOKEN}}"
          mappings:
            - field: unit
              label: service
            - field: api
              label: api
    - LiteLLM:
        icon: mdi-router-network
        href: /litellm/ui
        description: OpenAI API at /litellm/v1 · keys, logs, spend
        widget:
          type: customapi
          url: http://127.0.0.1:4000/litellm/health/readiness
          mappings:
            - field: status
              label: proxy
            - field: db
              label: db
- Agents:
    - Hermes:
        icon: mdi-robot
        href: /hermes/
        description: Hermes Agent gateway · its own login
        siteMonitor: http://127.0.0.1:9119/login
- Admin:
    - Strata control:
        icon: mdi-power
        href: /admin/
        description: start / stop / restart the model server
    - Cockpit:
        icon: cockpit
        href: https://localhost:9090/
        description: system admin · services, logs, terminal, updates
        siteMonitor: https://127.0.0.1:9090/
